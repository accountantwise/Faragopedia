# Included at server level AND in every location that sets its own add_header:
# nginx drops inherited add_header lines in any block that defines one.
# HSTS is set by Cloudflare at the edge, not here.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Report-Only for now (2026-11-18): Cloudflare can inject scripts on the live
# hostname that local testing can't see. Check the browser console on the live
# site for CSP reports, then rename the header to Content-Security-Policy.
# The sha256 is the inline theme script in index.html; if that script changes,
# rebuild and recompute it (see docs/deployment.md).
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-bddQuqcL1Ii1R0jbeFcHB9iIlcVgwNUG4yZQywyYwMk='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

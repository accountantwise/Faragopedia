server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving the backend at request time (via the
    # variable below) means nginx still starts if the backend container is
    # down or recreated with a new IP.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Same-origin API (ADR 0010). Build with VITE_API_BASE_URL=/api so the
    # browser calls /api on the frontend hostname, which Cloudflare Access
    # already gates, and the backend needs no public hostname of its own.
    # Host is passed through unchanged, so the X-API-Key middleware (which only
    # gates FARAGOPEDIA_API_HOSTNAME) never applies to this traffic.
    location /api/ {
        set $backend http://backend:8300;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads (source files, backup import) and long LLM calls (ingest, lint).
        client_max_body_size 500m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
